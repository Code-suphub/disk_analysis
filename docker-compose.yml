services:
  disk-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # macOS挂载所有常用目录
      # - /:/host:ro
      # - /Volumes:/Volumes:ro
      # - /Users:/Users:ro
      # Windows支持 - 使用时取消注释
      - /host_mnt/c:/C:ro
      - /host_mnt/d:/D:ro
      - /host_mnt/d:/E:ro
      - /host_mnt/d:/F:ro
      - /host_mnt/d:/G:ro
    environment:
      # 设置环境变量，如需要
      - NODE_ENV=production
    # 如果需要在开发模式下运行，取消下面一行的注释
    # command: dev
    # 如果需要交互式界面，可以使用VNC
    ports:
      - "5900:5900"  # VNC端口(如果添加VNC服务)
    # 有GUI应用使用
    ipc: host 